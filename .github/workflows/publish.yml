name: Publish
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout repo
      - uses: actions/checkout@v5

      # Step 2: Setup Node.js with correct registry
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: "@amronak"

      # Step 3: Debug token presence
      - name: Debug token presence
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "❌ NODE_AUTH_TOKEN is NOT set!"
            exit 1
          else
            echo "✅ NODE_AUTH_TOKEN is set (hidden for security)"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Step 4: Debug .npmrc setup
      - name: Check .npmrc
        run: |
          echo "---- Home .npmrc ----"
          cat ~/.npmrc || echo "No home .npmrc found"
          echo "---- Project .npmrc ----"
          cat .npmrc || echo "No project .npmrc found"

      # Step 5: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 6: Build project
      - name: Build project
        run: npm run build

      # Step 7: Publish package
      - name: Publish to GitHub Packages
        run: npm publish --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
